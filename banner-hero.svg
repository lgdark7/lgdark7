<svg width="850" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040508" />
      <stop offset="55%" stop-color="#0a0d16" />
      <stop offset="100%" stop-color="#121624" />
    </linearGradient>

    <!-- Mountain Gradient 1 (Distant Range) -->
    <linearGradient id="mtn1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24283b" />
      <stop offset="100%" stop-color="#0e1017" />
    </linearGradient>

    <!-- Mountain Gradient 2 (Mid Range) -->
    <linearGradient id="mtn2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1c29" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- Mountain Gradient 3 (Foreground Cyber Ridge) -->
    <linearGradient id="mtn3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12131c" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Celestial Moon Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Drifting Ridge Mist Gradient -->
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#94a3b8" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.14" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Left Text Protection Scrim -->
    <linearGradient id="textVignette" x1="0%" y1="0%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#040508" stop-opacity="0.92" />
      <stop offset="55%" stop-color="#040508" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#040508" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Accent Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes floatMoon {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }
    @keyframes driftMist {
      0% { transform: translateX(0); }
      50% { transform: translateX(-70px); }
      100% { transform: translateX(0); }
    }
    @keyframes meteorStreak {
      0% { transform: translateX(0) translateY(0); opacity: 0; }
      8% { opacity: 1; }
      26% { transform: translateX(-160px) translateY(80px); opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes pulseRadar {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .star-1 { animation: twinkle 3s ease-in-out infinite; transform-origin: center; }
    .star-2 { animation: twinkle 4.2s ease-in-out infinite 1.1s; transform-origin: center; }
    .star-3 { animation: twinkle 2.6s ease-in-out infinite 0.7s; transform-origin: center; }
    .moon-anim { animation: floatMoon 9s ease-in-out infinite; }
    .orbit-anim { animation: rotateRing 28s linear infinite; transform-origin: center; }
    .mist-anim { animation: driftMist 16s ease-in-out infinite alternate; }
    .meteor { animation: meteorStreak 8.5s ease-in infinite 2.5s; }
    .beacon { animation: beaconBlink 2.2s ease-in-out infinite; }
    .radar-ring { animation: pulseRadar 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; transform-origin: center; }

    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    }
  </style>

  <!-- Base Canvas Frame -->
  <rect width="850" height="220" rx="14" fill="url(#skyGrad)" stroke="#1f2438" stroke-width="1.2" />

  <!-- Background Cyber Constellation Lines -->
  <g stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.18" stroke-dasharray="2 3">
    <line x1="320" y1="35" x2="380" y2="55" />
    <line x1="380" y1="55" x2="440" y2="28" />
    <line x1="440" y1="28" x2="510" y2="60" />
    <line x1="570" y1="40" x2="630" y2="25" />
    <line x1="630" y1="25" x2="710" y2="45" />
    <line x1="710" y1="45" x2="770" y2="30" />
  </g>

  <!-- Stars Field -->
  <g fill="#ffffff">
    <!-- Star cluster right -->
    <circle cx="570" cy="40" r="1.1" class="star-1" />
    <circle cx="610" cy="62" r="1.3" class="star-2" />
    <circle cx="650" cy="32" r="0.8" class="star-3" />
    <circle cx="725" cy="65" r="1.2" class="star-1" />
    <circle cx="770" cy="30" r="1.4" class="star-2" />
    <circle cx="815" cy="55" r="0.9" class="star-3" />
    <circle cx="535" cy="68" r="1.0" class="star-2" />
    <circle cx="680" cy="18" r="0.7" class="star-1" />

    <!-- Star cluster mid/left -->
    <circle cx="320" cy="35" r="1.0" class="star-3" />
    <circle cx="380" cy="55" r="0.9" class="star-1" />
    <circle cx="440" cy="28" r="1.3" class="star-2" />
    <circle cx="510" cy="60" r="1.1" class="star-3" />
    <circle cx="260" cy="48" r="0.8" class="star-1" />
    <circle cx="170" cy="32" r="1.0" class="star-3" />
  </g>

  <!-- Minimalist Shooting Meteor -->
  <g class="meteor" opacity="0">
    <line x1="740" y1="18" x2="695" y2="42" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="695" cy="42" r="1.8" fill="#ffffff" filter="url(#glowCyan)" />
  </g>

  <!-- Celestial Cyber Orb / Moon -->
  <g class="moon-anim" transform="translate(685, 58)">
    <!-- Ambient Corona Glow -->
    <circle cx="0" cy="0" r="48" fill="url(#moonGlow)" />
    <!-- Rotating Cyber Orbit Ring -->
    <circle cx="0" cy="0" r="25" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.45" fill="none" stroke-dasharray="3 5" class="orbit-anim" />
    <!-- Core Moon -->
    <circle cx="0" cy="0" r="17" fill="#f8fafc" />
    <!-- Subtle Crater Shadow / Eclipse -->
    <circle cx="6" cy="-3" r="15" fill="#0d111a" opacity="0.88" />
    <!-- Tech Dot on Moon Crest -->
    <circle cx="-5" cy="3" r="1.5" fill="#38bdf8" opacity="0.9" />
  </g>

  <!-- Distant Mountain Range (Layer 1 - Low Poly) -->
  <path d="M 140 220 L 240 142 L 325 174 L 415 118 L 510 158 L 600 112 L 690 148 L 780 108 L 850 138 L 850 220 Z"
        fill="url(#mtn1)" />
  <!-- Distant Crest Highlights -->
  <path d="M 240 142 L 325 174 M 415 118 L 510 158 M 600 112 L 690 148 M 780 108 L 850 138"
        stroke="#475569" stroke-width="0.8" fill="none" opacity="0.55" />

  <!-- Mid Mountain Range (Layer 2) -->
  <path d="M 0 220 L 75 162 L 175 182 L 280 132 L 380 172 L 485 126 L 595 168 L 705 122 L 805 162 L 850 146 L 850 220 Z"
        fill="url(#mtn2)" />
  <!-- Mid Ridge Edge Light -->
  <path d="M 0 220 L 75 162 L 175 182 L 280 132 L 380 172 L 485 126 L 595 168 L 705 122 L 805 162 L 850 146"
        stroke="#64748b" stroke-width="1.0" fill="none" opacity="0.45" />

  <!-- Animated Drifting Mist Across Ridge -->
  <g class="mist-anim">
    <ellipse cx="490" cy="162" rx="360" ry="18" fill="url(#mistGrad)" />
    <ellipse cx="660" cy="178" rx="260" ry="15" fill="url(#mistGrad)" />
  </g>

  <!-- Foreground Mountain Ridge (Layer 3 - Sharp Cybernetic Contours) -->
  <path d="M 0 220 L 0 172 L 115 182 L 215 152 L 345 194 L 480 148 L 620 188 L 750 152 L 850 178 L 850 220 Z"
        fill="url(#mtn3)" />
  <path d="M 0 172 L 115 182 L 215 152 L 345 194 L 480 148 L 620 188 L 750 152 L 850 178"
        stroke="#94a3b8" stroke-width="1.2" fill="none" opacity="0.32" />

  <!-- Peak Telemetry Signal Beacon (Pulsing Radar Node) -->
  <g transform="translate(480, 148)">
    <circle cx="0" cy="0" r="12" stroke="#38bdf8" stroke-width="1.2" fill="none" class="radar-ring" />
    <circle cx="0" cy="0" r="3" fill="#38bdf8" class="beacon" filter="url(#glowCyan)" />
  </g>

  <!-- Left Side Text Scrim Vignette -->
  <rect x="0" y="0" width="560" height="220" rx="14" fill="url(#textVignette)" />

  <!-- Typography & Identity Section -->
  <g transform="translate(52, 44)">
    <!-- Status Tag Pill -->
    <g transform="translate(0, 8)">
      <circle cx="4" cy="4" r="3.5" fill="#38bdf8" class="beacon" />
      <text x="18" y="7.5" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="2.2" class="font-mono">SYSTEMS · MULTIMEDIA · KERNEL</text>
    </g>

    <!-- Main Identity Header -->
    <text x="0" y="62" fill="#ffffff" font-size="40" font-weight="800" letter-spacing="1.2" class="font-sans">Obito <tspan fill="#38bdf8" font-size="28" font-weight="600">/ lgdark7</tspan></text>

    <!-- Sub-role Descriptor -->
    <text x="0" y="94" fill="#94a3b8" font-size="14.5" font-weight="400" letter-spacing="0.3" class="font-sans">Native Android Systems Architect · Low-Level Media &amp; Audio DSP</text>

    <!-- Sleek Cyber Accent Bar -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="28" height="2.5" fill="#38bdf8" rx="1.2" />
      <rect x="34" y="0" width="10" height="2.5" fill="#64748b" rx="1.2" />
      <rect x="48" y="0" width="6" height="2.5" fill="#334155" rx="1.2" />
      <text x="68" y="4.5" fill="#64748b" font-size="10" font-weight="500" letter-spacing="1.5" class="font-mono">[ 0x7F · RTMP · FLV · KALI · KOTLIN ]</text>
    </g>
  </g>
</svg>
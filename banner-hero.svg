<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Nebula Ambient Glows -->
    <radialGradient id="nebulaCyan" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaViolet" cx="20%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#4338ca" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Celestial Cyber Core / Moon Glow -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f9ff" stop-opacity="1" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Mountain Layer Gradients -->
    <linearGradient id="mtnBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="mtnMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d2f" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="mtnFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Drifting Ridge Mist Gradient -->
    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#94a3b8" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.16" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Left Text Protection Scrim -->
    <linearGradient id="textScrim" x1="0%" y1="0%" x2="72%" y2="0%">
      <stop offset="0%" stop-color="#030712" stop-opacity="0.94" />
      <stop offset="60%" stop-color="#030712" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </linearGradient>

    <!-- Audio Visualizer EQ Bar Gradient -->
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes radarPulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    @keyframes shootingMeteor {
      0% { transform: translateX(0) translateY(0); opacity: 0; }
      8% { opacity: 1; }
      28% { transform: translateX(-190px) translateY(95px); opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes driftMist {
      0% { transform: translateX(0); }
      50% { transform: translateX(-70px); }
      100% { transform: translateX(0); }
    }
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }

    /* Dynamic Audio Equalizer Bars */
    @keyframes eqWave1 { 0%, 100% { height: 8px; y: 192px; } 50% { height: 38px; y: 162px; } }
    @keyframes eqWave2 { 0%, 100% { height: 16px; y: 184px; } 50% { height: 50px; y: 150px; } }
    @keyframes eqWave3 { 0%, 100% { height: 26px; y: 174px; } 50% { height: 62px; y: 138px; } }
    @keyframes eqWave4 { 0%, 100% { height: 12px; y: 188px; } 50% { height: 44px; y: 156px; } }
    @keyframes eqWave5 { 0%, 100% { height: 20px; y: 180px; } 50% { height: 56px; y: 144px; } }

    .star-1 { animation: twinkle 3s ease-in-out infinite; transform-origin: center; }
    .star-2 { animation: twinkle 4.2s ease-in-out infinite 1.2s; transform-origin: center; }
    .star-3 { animation: twinkle 2.5s ease-in-out infinite 0.7s; transform-origin: center; }
    
    .orb-anim { animation: floatOrb 8s ease-in-out infinite; }
    .ring-anim { animation: rotateRing 32s linear infinite; transform-origin: center; }
    .radar-rot { animation: radarScan 5s linear infinite; transform-origin: 755px 75px; }
    .radar-ring { animation: radarPulse 2.4s cubic-bezier(0.15, 0.85, 0.35, 1) infinite; transform-origin: 470px 162px; }
    .meteor { animation: shootingMeteor 8s ease-in infinite 2.2s; }
    .mist-anim { animation: driftMist 16s ease-in-out infinite alternate; }
    .beacon { animation: beaconBlink 2.2s ease-in-out infinite; }

    .b1 { animation: eqWave1 1.1s ease-in-out infinite alternate; }
    .b2 { animation: eqWave2 0.85s ease-in-out infinite alternate 0.15s; }
    .b3 { animation: eqWave3 1.25s ease-in-out infinite alternate 0.3s; }
    .b4 { animation: eqWave4 0.95s ease-in-out infinite alternate 0.2s; }
    .b5 { animation: eqWave5 1.15s ease-in-out infinite alternate 0.4s; }

    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    }
  </style>

  <!-- Base Canvas Frame -->
  <rect width="850" height="240" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Ambient Nebulas -->
  <rect width="850" height="240" rx="14" fill="url(#nebulaCyan)" />
  <rect width="850" height="240" rx="14" fill="url(#nebulaViolet)" />

  <!-- Constellation Wireframe Grid -->
  <g stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.18" stroke-dasharray="2 3">
    <line x1="280" y1="40" x2="340" y2="60" />
    <line x1="340" y1="60" x2="410" y2="30" />
    <line x1="410" y1="30" x2="480" y2="65" />
    <line x1="560" y1="45" x2="620" y2="28" />
    <line x1="620" y1="28" x2="700" y2="52" />
    <line x1="700" y1="52" x2="780" y2="35" />
  </g>

  <!-- Stars Field -->
  <g fill="#ffffff">
    <!-- Star cluster right -->
    <circle cx="560" cy="45" r="1.1" class="star-1" />
    <circle cx="600" cy="70" r="1.3" class="star-2" />
    <circle cx="645" cy="35" r="0.8" class="star-3" />
    <circle cx="715" cy="72" r="1.2" class="star-1" />
    <circle cx="765" cy="32" r="1.4" class="star-2" />
    <circle cx="810" cy="60" r="0.9" class="star-3" />
    <circle cx="525" cy="75" r="1.0" class="star-2" />
    <circle cx="685" cy="20" r="0.7" class="star-1" />

    <!-- Star cluster mid/left -->
    <circle cx="280" cy="40" r="1.0" class="star-3" />
    <circle cx="340" cy="60" r="0.9" class="star-1" />
    <circle cx="410" cy="30" r="1.3" class="star-2" />
    <circle cx="480" cy="65" r="1.1" class="star-3" />
    <circle cx="220" cy="52" r="0.8" class="star-1" />
    <circle cx="150" cy="35" r="1.0" class="star-3" />
  </g>

  <!-- Minimalist Shooting Meteor -->
  <g class="meteor" opacity="0">
    <line x1="770" y1="18" x2="720" y2="44" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="720" cy="44" r="2.0" fill="#ffffff" filter="url(#cyanGlow)" />
  </g>

  <!-- Cybernetic Targeting Reticle / Satellite Radar (Top Right) -->
  <g transform="translate(755, 75)" opacity="0.85">
    <circle cx="0" cy="0" r="32" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="3 3" fill="none" />
    <circle cx="0" cy="0" r="20" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.45" fill="none" />
    <circle cx="0" cy="0" r="8" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" fill="none" />
    <!-- Rotating Radar Sweep Line -->
    <g class="radar-rot">
      <line x1="0" y1="0" x2="28" y2="-14" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
    </g>
    <circle cx="0" cy="0" r="2" fill="#38bdf8" />
  </g>

  <!-- Celestial Cyber Orb / Eclipse Moon -->
  <g class="orb-anim" transform="translate(670, 62)">
    <!-- Ambient Halo Corona -->
    <circle cx="0" cy="0" r="52" fill="url(#orbGlow)" />
    <!-- Rotating Outer Cyber Orbit Ring -->
    <circle cx="0" cy="0" r="28" stroke="#38bdf8" stroke-width="1.0" stroke-opacity="0.5" fill="none" stroke-dasharray="3 5" class="ring-anim" />
    <!-- Core Moon -->
    <circle cx="0" cy="0" r="19" fill="#f8fafc" />
    <!-- Eclipse Silhouette -->
    <circle cx="7" cy="-4" r="16.5" fill="#090d16" opacity="0.9" />
    <!-- Cyber Node Indicator -->
    <circle cx="-6" cy="4" r="1.8" fill="#38bdf8" opacity="0.95" />
  </g>

  <!-- Distant Mountain Range (Layer 1) -->
  <path d="M 120 240 L 220 156 L 310 190 L 400 130 L 500 174 L 595 124 L 690 162 L 780 118 L 850 152 L 850 240 Z"
        fill="url(#mtnBack)" />
  <path d="M 220 156 L 310 190 M 400 130 L 500 174 M 595 124 L 690 162 M 780 118 L 850 152"
        stroke="#475569" stroke-width="0.8" fill="none" opacity="0.55" />

  <!-- Mid Mountain Range (Layer 2) -->
  <path d="M 0 240 L 70 178 L 165 198 L 270 144 L 375 188 L 470 138 L 585 182 L 695 134 L 795 176 L 850 160 L 850 240 Z"
        fill="url(#mtnMid)" />
  <path d="M 0 240 L 70 178 L 165 198 L 270 144 L 375 188 L 470 138 L 585 182 L 695 134 L 795 176 L 850 160"
        stroke="#64748b" stroke-width="1.0" fill="none" opacity="0.45" />

  <!-- Animated Drifting Mist Across Ridge -->
  <g class="mist-anim">
    <ellipse cx="480" cy="178" rx="360" ry="20" fill="url(#mistGrad)" />
    <ellipse cx="660" cy="195" rx="270" ry="16" fill="url(#mistGrad)" />
  </g>

  <!-- Foreground Cyber Ridge (Layer 3) -->
  <path d="M 0 240 L 0 190 L 105 200 L 205 166 L 335 212 L 470 162 L 610 206 L 740 166 L 850 194 L 850 240 Z"
        fill="url(#mtnFront)" />
  <path d="M 0 190 L 105 200 L 205 166 L 335 212 L 470 162 L 610 206 L 740 166 L 850 194"
        stroke="#94a3b8" stroke-width="1.2" fill="none" opacity="0.35" />

  <!-- Peak Telemetry Signal Node (Radar Beacon) -->
  <g transform="translate(470, 162)">
    <circle cx="0" cy="0" r="14" stroke="#38bdf8" stroke-width="1.2" fill="none" class="radar-ring" />
    <circle cx="0" cy="0" r="3.2" fill="#38bdf8" class="beacon" filter="url(#cyanGlow)" />
  </g>

  <!-- LIVE ANIMATED AUDIO DSP FREQUENCY SPECTRUM (Equalizer Bars) -->
  <g opacity="0.88">
    <text x="618" y="215" fill="#64748b" font-size="9" font-weight="600" letter-spacing="1.5" class="font-mono">AUDIO DSP ENGINE [44.1kHz STEREO]</text>
    <rect x="620" y="184" width="4" height="16" rx="2" fill="url(#eqGrad)" class="b1" />
    <rect x="628" y="174" width="4" height="26" rx="2" fill="url(#eqGrad)" class="b3" />
    <rect x="636" y="180" width="4" height="20" rx="2" fill="url(#eqGrad)" class="b5" />
    <rect x="644" y="188" width="4" height="12" rx="2" fill="url(#eqGrad)" class="b2" />
    <rect x="652" y="168" width="4" height="32" rx="2" fill="url(#eqGrad)" class="b4" />
    <rect x="660" y="160" width="4" height="40" rx="2" fill="url(#eqGrad)" class="b3" />
    <rect x="668" y="152" width="4" height="48" rx="2" fill="url(#eqGrad)" class="b2" />
    <rect x="676" y="162" width="4" height="38" rx="2" fill="url(#eqGrad)" class="b5" />
    <rect x="684" y="148" width="4" height="52" rx="2" fill="url(#eqGrad)" class="b3" />
    <rect x="692" y="156" width="4" height="44" rx="2" fill="url(#eqGrad)" class="b1" />
    <rect x="700" y="142" width="4" height="58" rx="2" fill="url(#eqGrad)" class="b2" />
    <rect x="708" y="150" width="4" height="50" rx="2" fill="url(#eqGrad)" class="b4" />
    <rect x="716" y="158" width="4" height="42" rx="2" fill="url(#eqGrad)" class="b5" />
    <rect x="724" y="164" width="4" height="36" rx="2" fill="url(#eqGrad)" class="b1" />
    <rect x="732" y="154" width="4" height="46" rx="2" fill="url(#eqGrad)" class="b3" />
    <rect x="740" y="168" width="4" height="32" rx="2" fill="url(#eqGrad)" class="b2" />
    <rect x="748" y="176" width="4" height="24" rx="2" fill="url(#eqGrad)" class="b4" />
    <rect x="756" y="182" width="4" height="18" rx="2" fill="url(#eqGrad)" class="b5" />
    <rect x="764" y="186" width="4" height="14" rx="2" fill="url(#eqGrad)" class="b1" />
    <rect x="772" y="190" width="4" height="10" rx="2" fill="url(#eqGrad)" class="b2" />
  </g>

  <!-- Left Side Text Protection Scrim Vignette -->
  <rect x="0" y="0" width="580" height="240" rx="14" fill="url(#textScrim)" />

  <!-- Typography & Identity Core Hierarchy -->
  <g transform="translate(54, 46)">
    <!-- Status Pill -->
    <g transform="translate(0, 8)">
      <circle cx="5" cy="5" r="3.5" fill="#38bdf8" class="beacon" />
      <text x="18" y="8.5" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2.2" class="font-mono">● ONLINE // SYSTEMS &amp; MULTIMEDIA ARCHITECT</text>
    </g>

    <!-- Main Identity Name -->
    <text x="0" y="66" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="1.2" class="font-sans">Benhin <tspan fill="#38bdf8" font-size="28" font-weight="600">/ Benhin3025</tspan></text>

    <!-- Subtitle / Role Tag -->
    <text x="0" y="100" fill="#94a3b8" font-size="15" font-weight="400" letter-spacing="0.3" class="font-sans">Native Android Systems Architect · Low-Level MediaCodec, RTMP &amp; Audio DSP</text>

    <!-- Sleek Cyber Accent Bar -->
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="32" height="2.5" fill="#38bdf8" rx="1.2" />
      <rect x="38" y="0" width="12" height="2.5" fill="#64748b" rx="1.2" />
      <rect x="54" y="0" width="8" height="2.5" fill="#334155" rx="1.2" />
      <text x="76" y="5" fill="#64748b" font-size="10.5" font-weight="500" letter-spacing="1.6" class="font-mono">[ 0x7F · RTMP · MEDIACODEC · FLV · KALI LINUX · KOTLIN ]</text>
    </g>
  </g>
</svg>